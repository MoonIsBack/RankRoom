<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/rankroom-icon.svg">
    <!--
      BEWUSST OHNE maximum-scale UND user-scalable=no.

      Beides sperrt auf dem Handy das Aufziehen mit zwei Fingern. Für Menschen,
      die schlecht sehen, ist der Zoom aber oft der einzige Weg, eine Seite
      überhaupt lesen zu können — deshalb gilt eine solche Sperre als echte
      Barriere (WCAG 2.1, Kriterium 1.4.4 "Textgröße ändern").

      Der übliche Grund, sie trotzdem einzubauen, ist das automatische
      Hineinzoomen von iOS beim Antippen eines Eingabefelds. Das passiert nur
      bei einer Schriftgröße unter 16px im Feld — der richtige Hebel ist also
      die Schriftgröße der Eingabefelder, nicht das Aussperren aller Nutzer.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Verrät beim Verlassen der Seite nicht, woher der Besucher kam.

      Klickt jemand auf einen Link nach außen, schickt der Browser sonst die
      genaue Herkunftsadresse mit. RankRoom verlinkt derzeit nirgendwohin, aber
      genau deshalb kostet die strengste Einstellung hier auch nichts — und sie
      gilt bereits, falls später einmal ein Link dazukommt.

      WICHTIG, weil leicht zu verwechseln: Als HTTP-Header "Referrer-Policy"
      ließe sich das auf GitHub Pages NICHT setzen, dort sind eigene Header
      nicht möglich. Diese Form hier — <meta name="referrer"> — ist eine eigene,
      im HTML-Standard vorgesehene Angabe und wirkt auch ohne Header.
    -->
    <meta name="referrer" content="no-referrer" />

    <title>RankRoom</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
